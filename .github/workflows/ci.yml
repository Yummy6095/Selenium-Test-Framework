name: Selenium Tests

on:
  push:
    branches: [ "master" ] # 确保分支名与你仓库的默认分支一致
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # 建议升级到 v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest allure-pytest # 确保安装测试框架

    - name: Run tests with pytest
      run: |
        python -m pytest --alluredir=./allure-results

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4 # 使用 v4 版本
      with:
        name: allure-report
        path: ./allure-results
